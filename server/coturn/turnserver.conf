# Coturn TURN Server Configuration
# Production-ready configuration for SecureTransfer

# Listening port for TURN/STUN
listening-port=3478

# TLS listening port (for secure connections)
tls-listening-port=5349

# Listening IP addresses
listening-ip=0.0.0.0

# External IP address (set this to your server's public IP)
external-ip=YOUR_PUBLIC_IP

# Relay IP addresses
relay-ip=0.0.0.0

# TURN server realm
realm=securetransfer.com

# Server name
server-name=securetransfer-turn

# Authentication
# Use long-term credentials
lt-cred-mech

# User database (for authentication)
# Format: username:password
# In production, use a proper user database
user=securetransfer:SecureTransfer2025!

# SSL certificates (required for TLS)
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/private.pem

# Cipher list for TLS
cipher-list="ECDH+AESGCM:ECDH+CHACHA20:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS"

# Disable weak ciphers
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# Enable fingerprinting
fingerprint

# Log file
log-file=/var/log/coturn/turnserver.log

# Verbose logging (disable in production)
verbose

# Process limits
max-bps=1000000
bps-capacity=0
stale-nonce=600

# Security settings
no-multicast-peers
no-cli
no-loopback-peers
no-tcp-relay

# Database for user management (optional)
# userdb=/var/lib/coturn/turndb

# Enable STUN
stun-only=false

# Mobility support
mobility

# Origin restrictions (configure based on your domains)
allowed-peer-ip=0.0.0.0-255.255.255.255

# Deny private IP ranges for security
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Process management
pidfile=/var/run/coturn/turnserver.pid
