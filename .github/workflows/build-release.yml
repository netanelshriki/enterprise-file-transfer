name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Test Desktop Application
      run: |
        cd desktop
        mvn clean test
        
    - name: Test Signaling Server
      run: |
        cd server
        mvn clean test
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Test Android Application
      run: |
        cd android
        chmod +x gradlew
        ./gradlew test

  build-desktop-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build Windows MSI
      run: |
        cd desktop
        mvn clean compile jpackage:jpackage -Pwindows-msi
        
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: desktop/target/installer/*.msi
        retention-days: 30

  build-desktop-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build Linux DEB
      run: |
        cd desktop
        mvn clean compile jpackage:jpackage -Plinux-deb
        
    - name: Build Linux AppImage
      run: |
        cd desktop
        mvn jpackage:jpackage -Plinux-appimage
        
    - name: Upload Linux Packages
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: |
          desktop/target/installer/*.deb
          desktop/target/installer/*.AppImage
        retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
        
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/build/outputs/apk/release/*.apk
        retention-days: 30

  build-server:
    name: Build Signaling Server
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build Server JAR
      run: |
        cd server
        mvn clean package
        
    - name: Build Docker Image
      run: |
        cd server
        docker build -t securetransfer/signaling-server:latest .
        docker save securetransfer/signaling-server:latest -o signaling-server-docker.tar
        
    - name: Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: signaling-server
        path: |
          server/target/*.jar
          server/signaling-server-docker.tar
        retention-days: 30

  build-coturn:
    name: Build TURN Server
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Coturn Docker Image
      run: |
        cd server/coturn
        docker build -t securetransfer/coturn:latest .
        docker save securetransfer/coturn:latest -o coturn-docker.tar
        
    - name: Upload Coturn Docker Image
      uses: actions/upload-artifact@v4
      with:
        name: coturn-server
        path: server/coturn/coturn-docker.tar
        retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-desktop-windows, build-desktop-linux, build-android, build-server, build-coturn]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/windows-installer/*.msi
          artifacts/linux-packages/*.deb
          artifacts/linux-packages/*.AppImage
          artifacts/android-apk/*.apk
          artifacts/signaling-server/*.jar
          artifacts/signaling-server/*.tar
          artifacts/coturn-server/*.tar
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## SecureTransfer Release
          
          ### Desktop Applications
          - **Windows**: Install the MSI package for Windows 10/11
          - **Linux**: Use the DEB package for Ubuntu/Debian or AppImage for universal Linux
          
          ### Mobile Application
          - **Android**: Install the APK (requires Android 7.0+)
          
          ### Server Components
          - **Signaling Server**: Spring Boot JAR for WebSocket signaling
          - **TURN Server**: Coturn Docker image for NAT traversal
          
          ### Quick Start
          1. Install the desktop or mobile application
          2. Open the app - it will automatically discover other devices on your network
          3. Select files and choose a target device to transfer
          
          For internet transfers, deploy the signaling and TURN servers using the provided Docker images.
          
          See the [documentation](https://github.com/netanelshriki/file-transfer-app/tree/main/docs) for detailed setup instructions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Run OWASP Dependency Check
      run: |
        cd desktop
        mvn org.owasp:dependency-check-maven:check
        
    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: desktop/target/dependency-check-report.html
        retention-days: 7
