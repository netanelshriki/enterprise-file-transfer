# Enterprise File Transfer TURN Server Configuration

# Listening port for TURN/STUN
listening-port=3478

# TLS listening port for TURN/STUN over TLS/DTLS
tls-listening-port=5349

# Relay ports range
min-port=50000
max-port=50100

# Use fingerprints in TURN messages
fingerprint

# Use long-term credential mechanism
lt-cred-mech

# Realm for TURN server
realm=enterprise-file-transfer.local

# Static user credentials (in production, use database)
user=fileuser:filepass123

# Server name
server-name=enterprise-turn-server

# Verbose logging
verbose

# Log file
log-file=/var/log/turnserver.log

# No multicast relay
no-multicast-peers

# No loopback peers
no-loopback-peers

# Mobility support
mobility

# No CLI
no-cli

# External IP (will be auto-detected in production)
# external-ip=YOUR_PUBLIC_IP

# Allow TURN over TCP
tcp-proxy-port=5555

# Certificate files (for TLS)
# cert=/etc/ssl/certs/turn_server_cert.pem
# pkey=/etc/ssl/private/turn_server_pkey.pem

# Disable unsafe legacy ciphers
no-tlsv1
no-tlsv1_1

# Enable STUN binding request
stun-only

# Allow origin
# allowed-peer-ip=0.0.0.0-255.255.255.255
